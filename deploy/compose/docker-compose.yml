# Sock Shop — Docker Compose (local lab)
# Tags pinadas de propósito (upstream arquivado; nunca use :latest).
# Origem das tags: manifests estáveis da comunidade / weaveworksdemos.

services:
  edge-router:
    image: weaveworksdemos/edge-router:0.1.1
    hostname: edge-router
    ports:
      - "80:80"
      - "8080:8080"
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    read_only: true
    tmpfs:
      - /var/run:rw,noexec,nosuid
    depends_on:
      - front-end

  front-end:
    image: weaveworksdemos/front-end:0.3.12
    hostname: front-end
    restart: unless-stopped
    cap_drop: [all]
    read_only: true
    depends_on:
      - catalogue
      - carts
      - orders
      - user
      - payment
      - shipping

  catalogue:
    image: weaveworksdemos/catalogue:0.3.5
    hostname: catalogue
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    depends_on:
      - catalogue-db

  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0
    hostname: catalogue-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "fake-root-password"
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: socksdb

  carts:
    image: weaveworksdemos/carts:0.4.8
    hostname: carts
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
    depends_on:
      - carts-db

  carts-db:
    image: mongo:3.4
    hostname: carts-db
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid

  orders:
    image: weaveworksdemos/orders:0.4.7
    hostname: orders
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
    depends_on:
      - orders-db
      - user
      - carts
      - payment
      - shipping

  orders-db:
    image: mongo:3.4
    hostname: orders-db
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid

  shipping:
    image: weaveworksdemos/shipping:0.4.8
    hostname: shipping
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false"
    depends_on:
      - rabbitmq

  queue-master:
    image: weaveworksdemos/queue-master:0.3.1
    hostname: queue-master
    restart: unless-stopped
    # Demo legado: monta docker.sock (não usar em produção).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3.6.8
    hostname: rabbitmq
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    read_only: true

  payment:
    image: weaveworksdemos/payment:0.4.3
    hostname: payment
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true

  user:
    image: weaveworksdemos/user:0.4.4
    hostname: user
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    environment:
      MONGO_HOST: user-db:27017
    depends_on:
      - user-db

  user-db:
    image: weaveworksdemos/user-db:0.4.0
    hostname: user-db
    restart: unless-stopped
    cap_drop: [all]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
